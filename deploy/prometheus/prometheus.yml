# Prometheus pulls metrics from the API; the API never pushes anywhere.
global:
  # 5s is aggressive for production but makes the local dashboard react quickly
  # while the traffic generator or load test is running.
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: duo-game-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: duo-game-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
