# Continuous integration: every pull request and every push to main must pass
# every gate before it can merge. Also called by release.yml so a release tag
# re-runs exactly the same gates before anything is published.
#
# Third-party actions are pinned to full commit SHAs (tags can be moved by
# whoever controls the action's repo); the comment shows the human version.
# Dependabot keeps the SHAs current.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, data and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Type check (mypy strict)
        run: mypy app scripts tests

      - name: Validate game data
        run: python scripts/validate_data.py

      - name: Check data manifest is current
        run: python scripts/build_manifest.py --check

      - name: Tests with coverage gate
        # The threshold lives in pyproject.toml ([tool.coverage.report] fail_under).
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks also finds secrets that were committed and later deleted.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Audit Python dependencies (pip-audit)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Scan git history for secrets (gitleaks)
        # Runs the pinned gitleaks image: same tool and version as the pre-commit hook.
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  image:
    name: Build, scan and smoke test image
    needs: [quality, security, workflows]
    runs-on: ubuntu-24.04
    env:
      IMAGE: duo-game-api:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        # Fail only on HIGH/CRITICAL issues that have a fix available: those are actionable
        # now. Unfixed CVEs are reported in the log but cannot be resolved by this repo.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.76.1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Start stack with the scanned image
        # --no-build: the smoke test must exercise the exact image Trivy just scanned.
        run: |
          cp .env.example .env
          API_IMAGE="$IMAGE" docker compose up -d --no-build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Smoke test (/health, /ready, damage, /metrics)
        run: python scripts/smoke_test.py --timeout 90

      - name: Check Prometheus is scraping the API
        run: |
          for _ in $(seq 1 30); do
            if curl -fs localhost:9090/api/v1/targets | grep -q '"health":"up"'; then
              echo "Prometheus target is UP"; exit 0
            fi
            sleep 2
          done
          echo "Prometheus never reported the API target as up"; exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
