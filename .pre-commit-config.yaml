# Shift-left: the cheapest place to catch a problem is before it is committed.
# Install once with `pre-commit install`; hooks then run on every `git commit`.
# CI runs the same checks, so skipping hooks locally cannot skip the gates.

# data/ is exported by the game and must never be rewritten by a formatter.
exclude: ^data/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.ps1$
      - id: check-yaml
        # --unsafe: parse syntax only, so Compose tags such as !override are accepted.
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # The data checks run in their own pre-commit-managed environment (pydantic is
  # their only dependency), so they work from any shell, with or without a venv active.
  - repo: local
    hooks:
      - id: validate-data
        name: validate game data
        entry: python scripts/validate_data.py
        language: python
        additional_dependencies: [pydantic==2.14.1]
        pass_filenames: false
        always_run: true
      - id: manifest-current
        name: data manifest is current
        entry: python scripts/build_manifest.py --check
        language: python
        additional_dependencies: [pydantic==2.14.1]
        pass_filenames: false
        always_run: true
